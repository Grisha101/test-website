    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const provider = new GoogleAuthProvider();
    const auth = getAuth(app);

    async function signInWithGoogle() {
        try {
            await signInWithRedirect(auth, provider);
        } catch (error) {
            console.error(error);
        }
    }

    async function checkRedirectResult() {
        try {
            const result = await getRedirectResult(auth);
            if (result && result.user) {
                console.log(result.user);
            }
        } catch (error) {
            console.error(error);
        }
    }

    const sign = document.getElementById("signup");
    sign.addEventListener("click", signInWithGoogle);

    checkRedirectResult();

</script>


<script>
    // Modern browsers block autoplay until a user interacts with the page

        if (audio.paused) {
            audio.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
        }
    }, { once: true }); // { once: true } ensures this event listener only runs on the first click
</script>
