            <!-- The hidden audio element (no 'controls' attribute makes it invisible) -->
<audio id="bg-music" loop>
    <source src="Pufino - Enlivening (freetouse.com).mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<script>
    // Modern browsers block autoplay until a user interacts with the page
    window.addEventListener('click', () => {
        const audio = document.getElementById('bg-music');
        
        // Only trigger play if it isn't already playing
        if (audio.paused) {
            audio.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
        }
    }, { once: true }); // { once: true } ensures this event listener only runs on the first click
</script>
